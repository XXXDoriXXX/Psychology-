<section class="values">
    <div class="values__container">
        <article class="values__card">
            <p class="values__text">

            </p>
            <img
                    src="images/values-hand.svg"
                    width="130"
                    height="80"
                    alt=""
                    class="values__icon"
                    aria-hidden="true" />
        </article>

        <article class="values__card">

                <circle cx="85" cy="40" r="36" fill="none" stroke="#A35B5B" stroke-width="2" />
            </svg>
        </article>

        <article class="values__card">
            <p class="values__text">
                Честность – это умение видеть друг друга настоящими
            </p>
            <img
                    src="images/values-heart-eye.svg"
